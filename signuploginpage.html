<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Sign Up / Login — Travelfree</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="auth-main">
      <div class="auth-card">
        <h1 class="auth-title">
          Welcome to Travelfree
        </h1>
        
        <form class="auth-form">
          <input
            type="email"
            placeholder="Email"
            class="auth-input"
          />
          <input
            type="password"
            placeholder="Password"
            class="auth-input"
          />

          <button
            type="submit"
            class="auth-submit-button"
          >
            Sign Up / Login
          </button>
        </form>

        <div class="auth-divider-container">
          <hr class="auth-divider-line" />
          <span class="auth-divider-text">OR</span>
          <hr class="auth-divider-line" />
        </div>

        <button class="auth-google-button">
          Continue with Google
        </button>
      </div>
    </main>
  </body>
</html>
